<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kayıtlar | Kartla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.btn, .form-control { min-height: 44px; }</style>
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="h3 mb-3">Kaydedilen talepler</h1>
    <form id="tokenForm" class="row g-2 mb-3">
      <div class="col-sm-8 col-md-6">
        <label for="token" class="form-label">Admin token</label>
        <input type="password" id="token" class="form-control" autocomplete="off" required>
      </div>
      <div class="col-sm-4 d-flex align-items-end">
        <button type="submit" class="btn btn-dark w-100 w-sm-auto" id="loadBtn">Kayıtları getir</button>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="table-responsive">
      <table class="table table-striped bg-white align-middle d-none" id="table">
        <thead><tr><th>No</th><th>İsim</th><th>E-posta</th><th>Hizmet</th><th>Açıklama</th><th>Tarih</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="text-secondary small">Token yalnızca bu sayfada, istek sırasında kullanılır; saklanmaz.</p>
  </main>
  <script>
    const statusBox = document.getElementById('status');
    const table = document.getElementById('table');
    const rows = document.getElementById('rows');
    const btn = document.getElementById('loadBtn');

    function show(type, text) {
      statusBox.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'alert alert-' + type;
      d.textContent = text;
      statusBox.appendChild(d);
    }

    document.getElementById('tokenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Yükleniyor…';
      try {
        const res = await fetch('/api/requests', { headers: { 'X-Admin-Token': document.getElementById('token').value.trim() } });
        if (res.status === 401) { table.classList.add('d-none'); show('danger', 'Token hatalı ya da sunucuda ADMIN_TOKEN tanımlı değil (401).'); return; }
        if (!res.ok) { show('danger', 'Kayıtlar alınamadı (HTTP ' + res.status + ').'); return; }
        const data = await res.json();
        rows.innerHTML = '';
        data.forEach(r => {
          const tr = document.createElement('tr');
          [r.id, r.name, r.email, r.service, r.message, new Date(r.created_at).toLocaleString('tr-TR')].forEach(v => {
            const td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
          });
          rows.appendChild(tr);
        });
        table.classList.toggle('d-none', data.length === 0);
        show(data.length ? 'success' : 'info', data.length ? data.length + ' kayıt listelendi.' : 'Henüz kayıt yok.');
      } catch (err) {
        show('danger', 'Sunucuya ulaşılamadı.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kayıtları getir';
      }
    });
  </script>
</body>
</html>
